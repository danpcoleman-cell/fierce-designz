name: Publish site images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode images and fonts and commit them to the repo
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          for p in sorted(Path(".").rglob("*.b64")):
              dest = p.with_suffix("")
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(p.read_text()))
              print("decoded", p, "->", dest, dest.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts images
          if git diff --cached --quiet; then
            echo "Assets already published"
          else
            git commit -m "Add published binary site assets"
            git push
          fi
